<!DOCTYPE html>
<html>
<head>
    <title>Interactive Map with Draggable Markers</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h3>Interactive Map with Draggable Markers</h3>
    <div id="map" style="height: 700px; width: 100%;"></div> <!-- ✅ 지도 크기 증가 -->

    <script>
        // ✅ 서버에서 마커 데이터를 가져옴
        fetch('/get_waypoints')
            .then(response => response.json())
            .then(waypoints => {
                if (waypoints.length === 0) {
                    console.error("No waypoints found.");
                    return;
                }

                // ✅ 마커 좌표 평균값을 계산하여 지도 중심 자동 설정
                let totalLat = 0, totalLng = 0;
                waypoints.forEach(point => {
                    totalLat += point.Latitude;
                    totalLng += point.Longitude;
                });
                let centerLat = totalLat / waypoints.length;
                let centerLng = totalLng / waypoints.length;

                // ✅ 지도 중심을 마커 평균 위치로 설정 & 줌 레벨을 20으로 증가
                const map = L.map('map', {
                    zoomControl: true,  // 줌 컨트롤 유지
                    maxZoom: 22,        // ✅ 최대 줌 레벨 증가
                }).setView([centerLat, centerLng], 20);  // ✅ 확대 레벨 변경 (18 → 20)

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

                // ✅ 마커 추가 및 이동 이벤트 처리
                waypoints.forEach(point => {
                    const marker = L.marker([point.Latitude, point.Longitude], { draggable: true }) // 드래그 가능
                        .addTo(map)
                        .bindPopup(`ID: ${point.ID}`);

                    // ✅ 마커 클릭 시 자동으로 확대하도록 설정
                    marker.on('click', function () {
                        map.setView(marker.getLatLng(), 22);  // 클릭하면 줌 레벨 최대로 확대
                    });

                    // ✅ 마커 이동 시 새로운 좌표를 서버로 전송
                    marker.on('dragend', function (event) {
                        const position = marker.getLatLng();
                        console.log(`ID: ${point.ID}, New Position:`, position);

                        // ✅ AJAX 요청으로 서버에 새로운 좌표 전송
                        $.post('/update_rddf', {
                            id: point.ID,
                            lat: position.lat,
                            lng: position.lng
                        }, function (response) {
                            console.log('Response from server:', response);
                        });
                    });
                });
            })
            .catch(error => console.error('Error fetching waypoints:', error));
    </script>
</body>
</html>
